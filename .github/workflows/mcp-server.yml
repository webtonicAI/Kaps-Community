name: MCP server CI

on:
  push:
    paths:
      - "mcp-server/**"
  pull_request:
    paths:
      - "mcp-server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install and build
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
